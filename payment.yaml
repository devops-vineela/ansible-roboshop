- name: configure payment
  hosts: payment
  become: yes
  tasks:
  - name: install python
    ansible.builtin.package:
      name: "{{ item }}"
      state: installed
    loop:
    - python3 
    - gcc 
    - python3-devel
  
  - name: create roboshop user
    ansible.builtin.user:
      name: roboshop
      state: present
      shell: /sbin/nologin
      system: true
      home: /app
      comment: roboshop system user
  
  - name: create directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: download payment application code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip

  - name: unzipping the application code
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    ansible.builtin.pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app

  - name: copying payment service
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service
  
  - name: daemon-reload
    ansible.builtin.systemd:
      daemon-reload: yes

  - name: start and enable payment service
    ansible.builtin.service:
      name: payment
      state: started
      enabled: yes